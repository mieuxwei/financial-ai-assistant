[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-ai-assistant"
version = "0.1.0"
description = "Research platform for stock volatility-risk prediction and financial NLP intelligence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "scikit-learn>=1.8,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
financial-ai-import-holdings = "scripts.import_holdings:main"
financial-ai-market-data = "jobs.market_data:main"
financial-ai-news = "jobs.news:main"
financial-ai-sentiment = "jobs.sentiment:main"
financial-ai-sentiment-audit = "research.evaluation.sentiment_error_analysis:main"
financial-ai-chinese-sentiment-benchmark = "research.evaluation.chinese_sentiment_benchmark:main"
financial-ai-features = "jobs.features:main"
financial-ai-taiwan-dataset-audit = "research.evaluation.taiwan_dataset_audit:main"
financial-ai-taiwan-calibration-batch = "jobs.annotation_batch:main"
financial-ai-taiwan-annotation-agreement = "jobs.annotation_agreement:main"
financial-ai-source-gate = "research.evaluation.source_manifest:main"
financial-ai-fsc-archive-audit = "research.evaluation.fsc_archive_audit:main"
financial-ai-fsc-corpus = "research.training.fsc_corpus:main"
financial-ai-domain-feasibility = "research.training.domain_adaptation_feasibility:main"
financial-ai-domain-pilot = "research.training.domain_adaptation_pilot:main"
financial-ai-benchmark-data = "jobs.benchmark_data:main"
financial-ai-reaction-labels = "jobs.reaction_labels:main"
financial-ai-m8-market-data = "jobs.m8_market_data:main"
financial-ai-finmind-news-audit = "research.evaluation.finmind_news_audit:main"
financial-ai-risk-market-dataset = "jobs.risk_market_dataset:main"
financial-ai-risk-labels = "jobs.risk_labels:main"
financial-ai-risk-features = "jobs.risk_features:main"
financial-ai-risk-baselines = "jobs.risk_baselines:main"
financial-ai-risk-tree-models = "jobs.risk_tree_models:main"
financial-ai-risk-temporal-validation = "jobs.risk_temporal_validation:main"
financial-ai-risk-sealed-test = "jobs.risk_sealed_test:main"
financial-ai-risk-robustness = "jobs.risk_robustness:main"
financial-ai-conditional-risk = "jobs.conditional_risk:main"
financial-ai-operating-points = "jobs.operating_points:main"
financial-ai-regime-thresholds = "jobs.regime_thresholds:main"
financial-ai-final-study-dataset = "jobs.final_study_dataset:main"
financial-ai-final-study-feature-audit = "jobs.final_study_feature_audit:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<1.0",
]
nlp = [
  "torch>=2.5,<3.0",
  "transformers>=4.48,<5.0",
  "sentencepiece>=0.2,<1.0",
]
audit = [
  "pyarrow>=18.0,<22.0",
]
annotation = [
  "openpyxl>=3.1,<4.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "pipelines*", "research*", "jobs*", "line_adapter*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
