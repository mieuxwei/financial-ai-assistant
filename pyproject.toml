[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-ai-assistant"
version = "0.1.0"
description = "Research platform for financial news sentiment and short-term stock direction modeling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
financial-ai-import-holdings = "scripts.import_holdings:main"
financial-ai-market-data = "jobs.market_data:main"
financial-ai-news = "jobs.news:main"
financial-ai-sentiment = "jobs.sentiment:main"
financial-ai-sentiment-audit = "research.evaluation.sentiment_error_analysis:main"
financial-ai-chinese-sentiment-benchmark = "research.evaluation.chinese_sentiment_benchmark:main"
financial-ai-features = "jobs.features:main"
financial-ai-taiwan-dataset-audit = "research.evaluation.taiwan_dataset_audit:main"
financial-ai-taiwan-calibration-batch = "jobs.annotation_batch:main"
financial-ai-taiwan-annotation-agreement = "jobs.annotation_agreement:main"
financial-ai-source-gate = "research.evaluation.source_manifest:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<1.0",
]
nlp = [
  "torch>=2.5,<3.0",
  "transformers>=4.48,<5.0",
  "sentencepiece>=0.2,<1.0",
]
audit = [
  "pyarrow>=18.0,<22.0",
]
annotation = [
  "openpyxl>=3.1,<4.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "pipelines*", "research*", "jobs*", "line_adapter*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
