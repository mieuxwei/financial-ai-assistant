name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify database migration
        env:
          DATABASE_URL: sqlite:////tmp/financial-ai-ci.db
        run: alembic upgrade head
      - name: Test
        run: pytest --cov=backend --cov=pipelines.market_data --cov=pipelines.news --cov-report=term-missing
      - name: Lint
        run: ruff check .
      - name: Scan for common secret patterns
        run: python scripts/check_secrets.py .
